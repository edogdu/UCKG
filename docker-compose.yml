volumes:
  neo4j_vol:
    driver: local
  my_volume:
    driver: local
  airflow_logs:
    driver: local
 
networks:
  monitoring:
    driver: bridge
services:
  neo4j:
    image: neo4j:5.20-enterprise
    environment:
      NEO4J_AUTH: neo4j/abcd90909090
      NEO4J_PLUGINS: '["apoc", "apoc-extended", "n10s"]' # Auto-download APOC Core, APOC Extended, and n10s
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes' # Required for Enterprise version
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,n10s.*"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_trigger_enabled: "true"
      NEO4J_apoc_initializer_neo4j: "CALL apoc.cypher.runFile('file:///var/lib/neo4j/import/init.cypher')"
      # Updated JVM settings for Neo4j 5.x
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      # Metrics configuration for Neo4j 5.x
      NEO4J_server_metrics_enabled: "true"
      NEO4J_server_metrics_prometheus_enabled: "true"
      NEO4J_server_metrics_prometheus_endpoint: "0.0.0.0:2004"
      # Unmanaged extensions for n10s HTTP endpoint
      NEO4J_server_unmanaged__extension__classes: "n10s.endpoint=/rdf"
    ports:
      - "7474:7474"
      - "7687:7687"
      - "2004:2004"  # Expose Neo4j metrics endpoint
    volumes:
      - $PWD/plugins:/plugins # Mount plugins directory for all custom plugins
      - my_volume:/vol/data # Persist data
      - neo4j_vol:/data
      - $PWD/neo4j/import:/var/lib/neo4j/import # Import directory
    networks:
      - monitoring
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_LOG_LEVEL=warn # reduces output of grafana logs
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    depends_on:
      - prometheus
    networks:
      - monitoring
  
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
  uckg-scripts:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: abcd90909090
      VOL_PATH: /vol/data
      OLLAMA_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: nomic-embed-text:latest
      EMBED_ENV: "false"
      LOG_LEVEL: "INFO"
      EMBEDDING_BATCH_SIZE: "1500"
    volumes:
      - my_volume:/vol/data # Persist data
      - ./logs:/app/logs # Mount logs directory for embedding process
    networks:
      - monitoring
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
  statsd: # This service is required if we want to scrape metrics from Airflow and disaply them in Prometheus
    image: prom/statsd-exporter
    ports:
      - "9102:9102"
    networks:
      - monitoring
  init-airflow-vol:
    image: busybox
    command: ["sh", "-c", "chown -R 50000:0 /vol/data && chmod -R 777 /vol/data"]
    volumes:
      - my_volume:/vol/data
    user: root
  # Required for airflow webserver to work.
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    networks:
      - monitoring
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: apache/airflow:latest
    working_dir: /opt/airflow/repo
    restart: always
    depends_on:
      - postgres
      - airflow-scheduler
      - init-airflow-vol
    environment:
      - VOL_PATH=/vol/data
      - PYTHONWARNINGS=ignore::SyntaxWarning # Reduces verbosity of logs for third-party packages we cannot modify.
      - AIRFLOW__LOGGING__LOGGING_LEVEL=WARNING # Reduces verbosity of logs for Airflow - INFO and DEBUG logs are not shown.
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - PYTHONPATH=/opt/airflow/data_collection
      - LOAD_EX=n
    ports:
      - "8081:8080"
    command: bash -c "airflow db upgrade && airflow users create \
      --username admin \
      --password admin \
      --firstname Admin --lastname User --role Admin --email admin@example.com && \
      airflow webserver"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/airflow/repo
      - my_volume:/vol/data
    networks:
      - monitoring
  airflow-scheduler:
    image: apache/airflow:latest
    working_dir: /opt/airflow/repo
    restart: always
    depends_on:
      - postgres
      - init-airflow-vol
    environment:
      - VOL_PATH=/vol/data
      - PYTHONPATH=/opt/airflow/repo
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: bash -c "airflow scheduler"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/airflow/repo
      - my_volume:/vol/data
    networks:
      - monitoring